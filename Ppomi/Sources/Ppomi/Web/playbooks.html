<!doctype html><meta charset="utf-8"><title>절차</title>
<style>/*THEME*/
.head{display:flex;align-items:center;gap:12px;padding:0;cursor:pointer;user-select:none} .name{font-weight:500} .n{margin-left:auto}
pre{display:none;margin-top:8px;padding:0;background:none;font:12px/1.55 var(--sans)} .card.open pre{display:block}
.combo{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center;margin:8px 0 0}
</style>
<div class="sec">앱별 절차<span class="r">data/playbooks/*.md · 고치면 바로 반영</span></div>
<div id="list"></div>
<script>
var P=/*PLAYBOOKS*/null;
function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var K={'👤':'사용자','🎟':'쿠폰','🔍':'조회','✋':'승인','📝':'기록','👁':'화면','🌐':'웹','🏦':'수집'};   // 컬러 이모지 → 단어. 단색 글리프 ▶⊙⌨↓⎋는 그대로
var L=document.getElementById('list');
if(!P||!P.length){L.innerHTML='<div class="meta">절차 파일이 없다. data/playbooks/앱이름.md 를 만들면 여기에 뜬다.</div>'}
(P||[]).slice().sort(function(a,b){return (a.app==='공통')-(b.app==='공통')}).forEach(function(p){
  var comboLine=(p.text.split('\n').find(function(l){return /^콤보\s*[:：]/.test(l)})||'').replace(/^콤보\s*[:：]\s*/,'');
  var moves=comboLine?comboLine.split(/\s*›\s*/):[];
  var body=p.text.split('\n').filter(function(l){return !/^콤보\s*[:：]/.test(l)}).join('\n');
  var lines=moves.length||p.text.split('\n').filter(function(l){return /^\s*(-|\d+\.)/.test(l)}).length;
  var combo=moves.length?'<div class="combo">'+moves.map(function(m,j){var g=m.match(/^([▶⊙⌨↓⎋👤🎟🔍✋📝👁🌐🏦️]+)(.*)$/u);var cls=/👤|✋/.test(m)?' you':'';return (j?'<span class="sep">›</span>':'')+'<span class="chip'+cls+'">'+(g?'<span class="g">'+g[1].replace(/👤|🎟|🔍|✋|📝|👁|🌐|🏦|️/g,function(e){return K[e]||''})+'</span>'+esc(g[2]):esc(m))+'</span>'}).join('')+'</div>':'';
  var status=p.installed&&p.installed!=='설치됨'?'<span class="meta">'+p.installed+'</span>':'';
  var d=document.createElement('div');d.className='card';
  var legend=p.app==='공통';
  d.innerHTML='<div class="head" title="'+esc(p.file)+'"><span class="name">'+(legend?'공통 · 표기와 규칙':esc(p.app))+'</span>'+status+'<span class="n meta">'+(legend?'':lines+'단계')+'</span></div>'+combo+'<pre>'+esc(body.replace(/^# .*\n/,''))+'</pre>';
  d.querySelector('.head').onclick=function(){d.classList.toggle('open')};
  L.appendChild(d);
});
</script>
